name: Build Flutter APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Manuel olarak GitHub sitesinden tetikleme butonu

jobs:
  build:
    name: Build ${{ matrix.app_name }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_dir: "live_streaming_with_minigame"
            app_name: "Zego-Live-Audio-Minigame-App"
          - app_dir: "live_streaming_with_pkbattles"
            app_name: "Zego-Live-PK-Battle-App"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./${{ matrix.app_dir }}
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ./${{ matrix.app_dir }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_name }}-Release-APK
          path: ./${{ matrix.app_dir }}/build/app/outputs/flutter-apk/app-release.apk
