name: Build Single Flutter APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build All-in-One Super Live APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Install Dependencies
        working-directory: ./live_streaming_with_minigame
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ./live_streaming_with_minigame
        run: flutter build apk --release

      - name: Upload Single All-in-One APK
        uses: actions/upload-artifact@v4
        with:
          name: Zego-Canli-Yayin-Super-App-APK
          path: ./live_streaming_with_minigame/build/app/outputs/flutter-apk/app-release.apk
